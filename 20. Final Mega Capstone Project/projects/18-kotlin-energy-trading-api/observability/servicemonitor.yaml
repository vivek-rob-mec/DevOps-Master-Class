apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: energy-trading, namespace: energy-kotlin }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: energy-trading } }
  endpoints: [{ port: http, path: /metrics, interval: 30s, scrapeTimeout: 10s }]
