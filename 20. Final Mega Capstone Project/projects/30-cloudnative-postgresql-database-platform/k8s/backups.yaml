apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: { name: orders-daily, namespace: database }
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster: { name: orders }
  method: plugin
  pluginConfiguration: { name: barman-cloud.cloudnative-pg.io }
  immediate: true
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata: { name: orders-release-gate, namespace: database }
spec:
  cluster: { name: orders }
  method: plugin
  pluginConfiguration: { name: barman-cloud.cloudnative-pg.io }
