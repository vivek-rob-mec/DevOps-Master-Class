services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "${POSTGRES_USER:-app}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-development-only}", POSTGRES_DB: "${POSTGRES_DB:-orders}" }
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-orders}"], interval: 3s, timeout: 2s, retries: 30 }
    networks: [data]
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports: ["8474:8474"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [edge,data]
  proxy-init:
    image: curlimages/curl:8.16.0
    command: ["-fsS","-X","POST","http://toxiproxy:8474/proxies","-H","Content-Type: application/json","-d","{\"name\":\"postgres\",\"listen\":\"0.0.0.0:5433\",\"upstream\":\"postgres:5432\"}"]
    depends_on: { toxiproxy: { condition: service_started } }
    restart: on-failure
    networks: [edge]
  api:
    build: app
    environment: { DATABASE_URL: "${DATABASE_URL:-postgresql://app:local-development-only@toxiproxy:5433/orders}" }
    ports: ["${APP_PORT:-8106}:8080"]
    depends_on: { proxy-init: { condition: service_completed_successfully } }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
networks: { edge: {}, data: { internal: true } }
volumes: { postgres-data: {} }
