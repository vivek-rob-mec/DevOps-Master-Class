apiVersion: apps/v1
kind: Deployment
metadata: { name: "${{ values.name }}", labels: { app.kubernetes.io/name: "${{ values.name }}", platform.example.io/tier: "${{ values.tier }}" } }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: "${{ values.name }}" } }
  template:
    metadata: { labels: { app.kubernetes.io/name: "${{ values.name }}" } }
    spec:
      serviceAccountName: "${{ values.name }}"
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: ghcr.io/replace-me/${{ values.name }}:replace-with-digest
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
