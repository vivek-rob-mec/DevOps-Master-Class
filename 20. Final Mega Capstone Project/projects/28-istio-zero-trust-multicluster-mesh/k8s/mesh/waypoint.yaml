apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: shared-waypoint, namespace: mesh-shop }
spec:
  gatewayClassName: istio-waypoint
  listeners: [{ name: mesh, port: 15008, protocol: HBONE }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: public, namespace: mesh-shop }
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: catalog, namespace: mesh-shop }
spec:
  parentRefs: [{ name: public }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /catalog } }]
      timeouts: { request: 3s, backendRequest: 2s }
      backendRefs: [{ name: catalog, port: 80 }]
