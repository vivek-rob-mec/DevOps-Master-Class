apiVersion: v1
kind: ServiceAccount
metadata: { name: {{ .Release.Name }}-supplychain }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: { name: {{ .Release.Name }}-supplychain-config }
data:
{{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- range $w := .Values.workloads }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-supplychain-{{ $w.name }}
  labels: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $w.name }}, app.kubernetes.io/part-of: supplychain }
spec:
  replicas: {{ $w.replicas }}
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $w.name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $w.name }}, app.kubernetes.io/part-of: supplychain } }
    spec:
      serviceAccountName: {{ $.Release.Name }}-supplychain
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: {{ $w.name }}
          image: "{{ $.Values.image.registry }}/{{ $.Values.image.owner }}/{{ $.Values.image.prefix }}-{{ $w.name }}:{{ $.Values.image.tag }}"
          ports: [{ name: http, containerPort: {{ $w.port }} }]
          env:
            - { name: PORT, value: {{ $w.port | quote }} }
          {{- range $dep := $.Values.workloads }}
            - { name: {{ $dep.name | upper }}_URL, value: "http://{{ $.Release.Name }}-supplychain-{{ $dep.name }}" }
          {{- end }}
          envFrom:
            - configMapRef: { name: {{ $.Release.Name }}-supplychain-config }
            {{- if $.Values.existingSecret }}
            - secretRef: { name: {{ $.Values.existingSecret }} }
            {{- end }}
          readinessProbe: { httpGet: { path: {{ $w.health }}, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: {{ $w.health }}, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 128Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-supplychain-{{ $w.name }}
  labels: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $w.name }}, app.kubernetes.io/part-of: supplychain }
spec:
  selector: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $w.name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
{{- if $.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ $.Release.Name }}-supplychain-{{ $w.name }} }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $.Release.Name }}-supplychain-{{ $w.name }} }
  minReplicas: {{ $.Values.autoscaling.min }}
  maxReplicas: {{ $.Values.autoscaling.max }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $.Values.autoscaling.cpu }} } } }]
{{- end }}
{{- end }}
