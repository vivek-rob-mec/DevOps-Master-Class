apiVersion: v1
kind: Namespace
metadata: { name: workflows, labels: { pod-security.kubernetes.io/enforce: restricted } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: fulfillment-worker, namespace: workflows }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: fulfillment-worker, namespace: workflows }
spec:
  replicas: 3
  selector: { matchLabels: { app: fulfillment-worker } }
  template:
    metadata: { labels: { app: fulfillment-worker } }
    spec:
      serviceAccountName: fulfillment-worker
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/replace/fulfillment-worker@sha256:replace
          env:
            - { name: TEMPORAL_ADDRESS, value: temporal-frontend.temporal.svc:7233 }
            - { name: TEMPORAL_NAMESPACE, value: production }
            - { name: TASK_QUEUE, value: fulfillment-v1 }
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "2", memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: fulfillment-worker, namespace: workflows }
spec: { minAvailable: 2, selector: { matchLabels: { app: fulfillment-worker } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: worker-egress, namespace: workflows }
spec:
  podSelector: { matchLabels: { app: fulfillment-worker } }
  policyTypes: [Ingress, Egress]
  egress: [{ to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: temporal } } }], ports: [{ protocol: TCP, port: 7233 }] }]
