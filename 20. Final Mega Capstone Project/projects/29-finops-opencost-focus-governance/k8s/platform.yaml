apiVersion: v1
kind: Namespace
metadata: { name: finops, labels: { pod-security.kubernetes.io/enforce: restricted } }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: finops-quota, namespace: finops }
spec: { hard: { requests.cpu: "4", requests.memory: 8Gi, limits.cpu: "8", limits.memory: 16Gi } }
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: finops-alerts, namespace: finops }
spec:
  groups:
    - name: finops
      rules:
        - alert: NamespaceCostAnomaly
          expr: sum by (namespace) (increase(node_total_hourly_cost[1d])) > 1.5 * avg_over_time(sum by (namespace) (increase(node_total_hourly_cost[1d]))[14d:1d])
          for: 30m
          labels: { severity: warning, owner: finops }
          annotations: { summary: Namespace daily cost is over its historical baseline }
