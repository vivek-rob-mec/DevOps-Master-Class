apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: learning, namespace: learning-python }
spec:
  groups:
    - name: learning.availability
      rules:
        - alert: PublicEndpointDown
          expr: up{namespace="learning-python",service="learning-app"} == 0
          for: 5m
          labels: { severity: critical }
          annotations: { summary: "learning entry workload is down", runbook_url: "docs/RUNBOOK.md" }
