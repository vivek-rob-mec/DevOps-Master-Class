---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-api
  namespace: saas-typescript
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: saas }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: saas }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: saas }
    spec:
      serviceAccountName: saas
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/replace-me/12-typescript-nestjs-angular-saas-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          env: [{ name: PORT, value: "3000" }]
          envFrom:
            - configMapRef: { name: saas-config }
            - secretRef: { name: saas-runtime }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 2 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 5"] } } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 128Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: saas-api
  namespace: saas-typescript
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: saas }
spec:
  selector: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: saas }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-frontend
  namespace: saas-typescript
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: saas }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: saas }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: saas }
    spec:
      serviceAccountName: saas
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: ghcr.io/replace-me/12-typescript-nestjs-angular-saas-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env: [{ name: PORT, value: "8080" }]
          envFrom:
            - configMapRef: { name: saas-config }
            - secretRef: { name: saas-runtime }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 2 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 5"] } } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 128Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: saas-frontend
  namespace: saas-typescript
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: saas }
spec:
  selector: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: saas }
  ports: [{ name: http, port: 80, targetPort: http }]
