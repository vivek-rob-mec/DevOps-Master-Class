---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-risk-app
  namespace: payment-risk-rust
  labels: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: payment-risk }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: payment-risk }
  template:
    metadata:
      labels: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: payment-risk }
    spec:
      serviceAccountName: payment-risk
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: ghcr.io/replace-me/17-rust-payment-risk-service-app:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env: [{ name: PORT, value: "8080" }]
          envFrom:
            - configMapRef: { name: payment-risk-config }
            - secretRef: { name: payment-risk-runtime }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 2 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 5"] } } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 128Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: payment-risk-app
  namespace: payment-risk-rust
  labels: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: payment-risk }
spec:
  selector: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: payment-risk }
  ports: [{ name: http, port: 80, targetPort: http }]
