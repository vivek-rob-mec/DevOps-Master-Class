- rule: Interactive shell in production container
  desc: Detect shells launched in production application containers
  condition: container and spawned_process and k8s.ns.name in (prod, production, payments) and proc.name in (sh, bash, dash, zsh)
  output: "Interactive shell (user=%user.name command=%proc.cmdline container=%container.id pod=%k8s.pod.name ns=%k8s.ns.name)"
  priority: WARNING
  tags: [container, process, mitre_execution]
- rule: Package manager in immutable workload
  desc: Detect package installation that indicates runtime drift
  condition: container and spawned_process and proc.name in (apt, apt-get, apk, yum, dnf) and not k8s.ns.name in (dev, sandbox)
  output: "Package manager executed (command=%proc.cmdline pod=%k8s.pod.name ns=%k8s.ns.name)"
  priority: NOTICE
  tags: [container, drift]
