---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: shortener-app, namespace: shortener-go }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: shortener-app }
  minReplicas: 2
  maxReplicas: 6
  behavior: { scaleDown: { stabilizationWindowSeconds: 300 } }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: shortener-app, namespace: shortener-go }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: shortener }
