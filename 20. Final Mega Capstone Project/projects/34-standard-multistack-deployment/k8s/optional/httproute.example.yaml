# Platform prerequisite: an HTTPS Gateway that permits this namespace's routes.
# Replace hostname and the Gateway reference. Apply separately from the base.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: python-deployment-demo
  namespace: standard-dev
spec:
  parentRefs:
    - name: shared-public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - deployment.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: python-deployment-demo
          port: 80
