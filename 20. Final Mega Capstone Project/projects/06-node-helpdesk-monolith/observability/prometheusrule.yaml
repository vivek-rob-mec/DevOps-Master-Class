apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: helpdesk, namespace: helpdesk-node }
spec:
  groups:
    - name: helpdesk.availability
      rules:
        - alert: PublicEndpointDown
          expr: up{namespace="helpdesk-node",service="helpdesk-app"} == 0
          for: 5m
          labels: { severity: critical }
          annotations: { summary: "helpdesk entry workload is down", runbook_url: "docs/RUNBOOK.md" }
