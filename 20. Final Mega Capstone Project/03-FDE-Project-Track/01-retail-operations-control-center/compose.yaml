services:
  api:
    build: .
    image: retail-control-center:local
    ports:
      - "127.0.0.1:8216:8216"
    volumes:
      - retail-state:/app/state
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8216/readyz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    image: retail-control-center:local
    command: [python, app.py, worker]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - retail-state:/app/state
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
volumes:
  retail-state:
