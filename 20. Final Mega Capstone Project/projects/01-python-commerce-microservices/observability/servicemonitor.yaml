apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: commerce, namespace: commerce-python }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: commerce } }
  endpoints: [{ port: http, path: /metrics, interval: 30s, scrapeTimeout: 10s }]
