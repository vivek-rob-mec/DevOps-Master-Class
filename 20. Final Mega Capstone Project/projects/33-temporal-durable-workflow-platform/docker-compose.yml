services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: [temporal-db:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER}"], interval: 5s, timeout: 3s, retries: 30 }
  temporal:
    image: temporalio/auto-setup:1.31.2
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports: ["7233:7233"]
  temporal-ui:
    image: temporalio/ui:2.41.0
    depends_on: [temporal]
    environment: { TEMPORAL_ADDRESS: temporal:7233, TEMPORAL_CORS_ORIGINS: "http://localhost:3000" }
    ports: ["8233:8080"]
  worker:
    build: .
    depends_on: [temporal]
    environment: { TEMPORAL_ADDRESS: temporal:7233, TEMPORAL_NAMESPACE: default, TASK_QUEUE: fulfillment }
    restart: unless-stopped
volumes: { temporal-db: {} }
