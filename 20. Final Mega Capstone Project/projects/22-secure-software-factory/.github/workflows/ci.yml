name: untrusted-ci
on: { pull_request: {}, push: { branches-ignore: [main] } }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_action_pins.py .github/workflows
      - run: docker build -t secure-app:ci app
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with: { image: secure-app:ci, format: spdx-json, output-file: artifacts/sbom.spdx.json, upload-artifact: false }
