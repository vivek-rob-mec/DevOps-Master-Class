name: ci
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, packages: write, security-events: write }
concurrency: { group: "07-python-learning-monolith-${{ github.ref }}", cancel-in-progress: true }
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}
jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: kubectl kustomize k8s/overlays/dev >/tmp/manifests.yaml
      - run: bash scripts/test.sh
      - run: docker compose build --pull
      - run: docker compose up -d
      - run: bash scripts/smoke-test.sh http://localhost:8087
      - if: failure()
        run: docker compose logs --no-color --tail=300
      - if: always()
        run: docker compose down --volumes --remove-orphans
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, scan-ref: ., format: sarif, output: trivy.sarif, severity: "HIGH,CRITICAL", ignore-unfixed: true }
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy.sarif }
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: docker compose build --pull && docker compose push
