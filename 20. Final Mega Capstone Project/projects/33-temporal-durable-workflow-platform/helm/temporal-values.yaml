server:
  replicaCount: 3
  config:
    numHistoryShards: 512
    persistence:
      default: { driver: sql, sql: { driver: postgres12, host: replace-rw.database.svc, port: 5432, database: temporal, user: temporal, existingSecret: temporal-db } }
      visibility: { driver: sql, sql: { driver: postgres12, host: replace-rw.database.svc, port: 5432, database: temporal_visibility, user: temporal, existingSecret: temporal-db } }
  resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "2", memory: 4Gi } }
  podDisruptionBudget: { enabled: true, minAvailable: 2 }
prometheus: { enabled: false }
grafana: { enabled: false }
elasticsearch: { enabled: false }
cassandra: { enabled: false }
mysql: { enabled: false }
postgresql: { enabled: false }
