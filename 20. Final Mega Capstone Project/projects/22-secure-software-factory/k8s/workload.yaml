apiVersion: apps/v1
kind: Deployment
metadata: { name: signed-app, namespace: secure-runtime }
spec:
  replicas: 2
  selector: { matchLabels: { app: signed-app } }
  template:
    metadata: { labels: { app: signed-app } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: ghcr.io/replace/secure-app@sha256:replace-with-promoted-digest
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: signed-app, namespace: secure-runtime }
spec: { selector: { app: signed-app }, ports: [{ name: http, port: 80, targetPort: http }] }
