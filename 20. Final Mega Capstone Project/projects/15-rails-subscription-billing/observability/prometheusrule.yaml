apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: billing, namespace: billing-rails }
spec:
  groups:
    - name: billing.availability
      rules:
        - alert: PublicEndpointDown
          expr: up{namespace="billing-rails",service="billing-app"} == 0
          for: 5m
          labels: { severity: critical }
          annotations: { summary: "billing entry workload is down", runbook_url: "docs/RUNBOOK.md" }
