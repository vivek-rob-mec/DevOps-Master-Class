apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: telemetry, namespace: telemetry-cpp }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: telemetry } }
  endpoints: [{ port: http, path: /metrics, interval: 30s, scrapeTimeout: 10s }]
