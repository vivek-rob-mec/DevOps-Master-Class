apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: inventory, namespace: inventory-php }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: inventory } }
  endpoints: [{ port: http, path: /metrics, interval: 30s, scrapeTimeout: 10s }]
