apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: llm-platform }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gateway-dependencies, namespace: llm-platform }
spec:
  podSelector: { matchLabels: { app: rag-gateway } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: qdrant } } }]
      ports: [{ protocol: TCP, port: 6333 }]
    - ports: [{ protocol: TCP, port: 80 }, { protocol: TCP, port: 8080 }, { protocol: UDP, port: 53 }]
