image:
  registry: ghcr.io
  owner: replace-me
  prefix: 09-mern-team-collaboration
  tag: 0.1.0
  pullPolicy: IfNotPresent
existingSecret: ""
config: { APP_ENV: production, LOG_LEVEL: info }
workloads:
  - { name: api, port: 4000, health: /health, replicas: 2 }
  - { name: frontend, port: 8080, health: /health, replicas: 2 }
ingress: { enabled: true, className: nginx, host: collaboration.example.com }
autoscaling: { enabled: true, min: 2, max: 6, cpu: 70 }
