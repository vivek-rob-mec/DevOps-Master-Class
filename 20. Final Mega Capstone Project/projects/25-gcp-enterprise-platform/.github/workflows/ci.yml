name: gcp-platform-ci
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.13.5 }
      - run: python -m unittest discover -s tests -v
      - run: terraform -chdir=terraform/bootstrap fmt -check -recursive
      - run: terraform -chdir=terraform/bootstrap init -backend=false && terraform -chdir=terraform/bootstrap validate
      - run: terraform -chdir=terraform/workload fmt -check -recursive
      - run: terraform -chdir=terraform/workload init -backend=false && terraform -chdir=terraform/workload validate
      - run: kubectl kustomize k8s >/tmp/gcp-workload.yaml
