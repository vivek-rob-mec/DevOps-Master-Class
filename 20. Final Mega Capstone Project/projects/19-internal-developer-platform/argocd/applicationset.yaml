apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata: { name: workload-environments, namespace: argocd }
spec:
  goTemplate: true
  generators:
    - git: { repoURL: https://github.com/replace-me/platform-environments.git, revision: main, directories: [{ path: environments/* }] }
  template:
    metadata: { name: "{{.path.basename}}" }
    spec:
      project: workloads
      source: { repoURL: https://github.com/replace-me/platform-environments.git, targetRevision: main, path: "{{.path.path}}" }
      destination: { server: https://kubernetes.default.svc, namespace: "{{.path.basename}}" }
      syncPolicy: { automated: { prune: true, selfHeal: true }, syncOptions: [CreateNamespace=true] }
