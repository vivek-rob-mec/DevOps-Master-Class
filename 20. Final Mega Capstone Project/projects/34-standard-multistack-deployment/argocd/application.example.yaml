apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: standard-python-dev
  namespace: argocd
spec:
  project: standard-deployment
  source:
    repoURL: https://github.com/REPLACE_OWNER/REPLACE_REPO.git
    targetRevision: main
    path: k8s/overlays/dev/python
  destination:
    server: https://kubernetes.default.svc
    namespace: standard-dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
