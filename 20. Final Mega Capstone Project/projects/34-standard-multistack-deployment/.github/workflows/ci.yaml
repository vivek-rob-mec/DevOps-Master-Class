name: Build test scan and publish
on:
  pull_request:
    paths: ['apps/**', 'scripts/**', 'tests/**', '.github/workflows/ci.yaml']
  push:
    branches: [main]
    paths: ['apps/**', 'scripts/**', 'tests/**', '.github/workflows/ci.yaml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        stack: [python, node, java, go, dotnet]
    env:
      STACK: ${{ matrix.stack }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build once
        run: |
          mkdir -p evidence
          docker build --pull --label "org.opencontainers.image.revision=$REVISION" \
            -t "standard-$STACK:$REVISION" "apps/$STACK"
      - name: Test the container with runtime restrictions
        run: |
          docker run -d --name contract --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,size=64m,mode=1777 --memory 512m --cpus 1 --pids-limit 256 \
            -e APP_ENV=ci -e "APP_VERSION=$REVISION" \
            -p 127.0.0.1:8180:8080 "standard-$STACK:$REVISION"
          python scripts/smoke.py http://127.0.0.1:8180 --stack "$STACK" \
            --version "$REVISION" --environment ci | tee evidence/contract.txt
          docker stop --time 30 contract
          test "$(docker inspect --format '{{.State.OOMKilled}}' contract)" = false
          test "$(docker inspect --format '{{.State.ExitCode}}' contract)" != 137
      - name: Export the tested image
        run: docker save "standard-$STACK:$REVISION" -o evidence/image.tar
      - name: SBOM and vulnerability gate
        run: |
          docker run --rm -v "$PWD/evidence:/evidence" aquasec/trivy:0.74.0 image \
            --input /evidence/image.tar --format cyclonedx --output /evidence/sbom.cdx.json
          docker run --rm -v "$PWD/evidence:/evidence" aquasec/trivy:0.74.0 image \
            --input /evidence/image.tar --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --format json --output /evidence/vulnerabilities.json
      - name: Container logs
        if: always()
        run: |
          docker logs contract > evidence/container.log 2>&1 || true
          docker rm -f contract || true
      - name: Keep test and scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.stack }}
          path: |
            evidence/*.json
            evidence/*.txt
            evidence/*.log
          retention-days: 14
      - name: Transfer the tested image to publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.stack }}
          path: evidence/image.tar
          compression-level: 0
          retention-days: 1
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        stack: [python, node, java, go, dotnet]
    env:
      STACK: ${{ matrix.stack }}
      REVISION: ${{ github.sha }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ matrix.stack }}
          path: evidence
      - name: Publish the already tested image and record its digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/standard-$STACK"
          export IMAGE
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker load -i evidence/image.tar
          docker tag "standard-$STACK:$REVISION" "$IMAGE:$REVISION"
          docker push "$IMAGE:$REVISION"
          export DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$REVISION" | cut -d@ -f2)"
          python - <<'PY'
          import json, os, pathlib, re
          digest = os.environ['DIGEST']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest), digest
          release = {key.lower(): os.environ[key] for key in ('STACK', 'IMAGE', 'DIGEST', 'REVISION')}
          pathlib.Path('release-' + release['stack'] + '.json').write_text(json.dumps(release, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.stack }}
          path: release-*.json
          retention-days: 90
      - name: Registry logout
        if: always()
        run: docker logout ghcr.io
