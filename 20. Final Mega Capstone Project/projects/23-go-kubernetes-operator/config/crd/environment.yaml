apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: { name: environments.platform.masterclass.io }
spec:
  group: platform.masterclass.io
  scope: Cluster
  names: { plural: environments, singular: environment, kind: Environment, shortNames: [env] }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Namespace, type: string, jsonPath: .status.namespace }
        - { name: Ready, type: string, jsonPath: ".status.conditions[?(@.type=='Ready')].status" }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [owner, cpuQuota, memoryQuota]
              properties:
                owner: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$" }
                cpuQuota: { type: string, minLength: 1 }
                memoryQuota: { type: string, minLength: 1 }
                deleteNamespace: { type: boolean, default: false }
            status:
              type: object
              properties:
                observedGeneration: { type: integer, format: int64 }
                namespace: { type: string }
                conditions: { type: array, items: { type: object, x-kubernetes-preserve-unknown-fields: true } }
