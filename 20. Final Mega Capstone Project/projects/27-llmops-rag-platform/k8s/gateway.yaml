apiVersion: apps/v1
kind: Deployment
metadata: { name: rag-gateway, namespace: llm-platform }
spec:
  replicas: 2
  selector: { matchLabels: { app: rag-gateway } }
  template:
    metadata: { labels: { app: rag-gateway } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: gateway
          image: ghcr.io/replace/rag-gateway@sha256:replace
          env: [{ name: QDRANT_URL, value: http://qdrant:6333 }, { name: LLM_BASE_URL, value: http://qwen-predictor:80/v1 }, { name: LLM_MODEL, value: Qwen/Qwen3-0.6B }]
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: rag-gateway, namespace: llm-platform }
spec: { selector: { app: rag-gateway }, ports: [{ name: http, port: 80, targetPort: http }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: rag-gateway, namespace: llm-platform }
spec: { scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: rag-gateway }, minReplicas: 2, maxReplicas: 10, metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }] }
