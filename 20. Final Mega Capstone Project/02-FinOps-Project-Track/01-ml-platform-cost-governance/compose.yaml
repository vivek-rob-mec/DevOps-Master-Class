name: finops-cost-desk
x-runtime: &runtime
  build: .
  image: finops-cost-desk:local
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 64
  volumes: ["state:/state"]
services:
  prepare:
    <<: *runtime
    command: ["python","app.py","demo"]
  api:
    <<: *runtime
    depends_on:
      prepare:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8215:8080"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10
volumes:
  state:
