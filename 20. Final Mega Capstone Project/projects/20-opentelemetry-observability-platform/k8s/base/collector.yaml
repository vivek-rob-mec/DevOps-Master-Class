apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector, namespace: observability }
data:
  collector.yaml: |
    receivers: { otlp: { protocols: { grpc: { endpoint: 0.0.0.0:4317 }, http: { endpoint: 0.0.0.0:4318 } } } }
    processors: { memory_limiter: { check_interval: 1s, limit_mib: 384 }, batch: {} }
    exporters: { debug: { verbosity: basic } }
    service: { pipelines: { traces: { receivers: [otlp], processors: [memory_limiter,batch], exporters: [debug] }, metrics: { receivers: [otlp], processors: [memory_limiter,batch], exporters: [debug] }, logs: { receivers: [otlp], processors: [memory_limiter,batch], exporters: [debug] } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: observability }
spec:
  replicas: 2
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.157.0
          args: ["--config=/conf/collector.yaml"]
          ports: [{ name: otlp-grpc, containerPort: 4317 },{ name: otlp-http, containerPort: 4318 }]
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: config, mountPath: /conf, readOnly: true }]
      volumes: [{ name: config, configMap: { name: otel-collector } }]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: observability }
spec: { selector: { app: otel-collector }, ports: [{ name: otlp-grpc, port: 4317 },{ name: otlp-http, port: 4318 }] }
