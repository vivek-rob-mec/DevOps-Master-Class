apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inventory-php
resources:
  - ../../base
  - secret.local.yaml
  - postgres.yaml
nameSuffix: -dev
patches:
  - target: { kind: Deployment, labelSelector: app.kubernetes.io/part-of=inventory }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
images:
  - name: ghcr.io/replace-me/04-php-inventory-monolith-app
    newTag: dev
