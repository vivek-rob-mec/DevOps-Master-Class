---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logistics-web
  namespace: logistics-django
  labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: logistics }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: logistics }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: logistics }
    spec:
      serviceAccountName: logistics
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/replace-me/14-django-logistics-workers-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          env: [{ name: PORT, value: "8000" }]
          envFrom:
            - configMapRef: { name: logistics-config }
            - secretRef: { name: logistics-runtime }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 2 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 5"] } } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 128Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: logistics-web
  namespace: logistics-django
  labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: logistics }
spec:
  selector: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: logistics }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logistics-worker
  namespace: logistics-django
  labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: logistics }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: logistics }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: logistics }
    spec:
      serviceAccountName: logistics
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: ghcr.io/replace-me/14-django-logistics-workers-worker:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8001 }]
          env: [{ name: PORT, value: "8001" }]
          envFrom:
            - configMapRef: { name: logistics-config }
            - secretRef: { name: logistics-runtime }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 6 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 2 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 5"] } } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 128Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: logistics-worker
  namespace: logistics-django
  labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: logistics }
spec:
  selector: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: logistics }
  ports: [{ name: http, port: 80, targetPort: http }]
