apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  annotations: { github.com/project-slug: "${{ values.name }}", argocd/app-name: "${{ values.name }}-prod" }
  tags: [golden-path, "${{ values.tier }}"]
spec: { type: service, lifecycle: experimental, owner: "${{ values.owner }}", system: "${{ values.system }}" }
