image:
  registry: ghcr.io
  owner: replace-me
  prefix: 02-java-banking-microservices
  tag: 0.1.0
  pullPolicy: IfNotPresent
existingSecret: ""
config: { APP_ENV: production, LOG_LEVEL: info }
workloads:
  - { name: gateway, port: 8080, health: /actuator/health, replicas: 2 }
  - { name: accounts, port: 8081, health: /actuator/health, replicas: 2 }
  - { name: ledger, port: 8082, health: /actuator/health, replicas: 2 }
  - { name: frontend, port: 8080, health: /health, replicas: 2 }
ingress: { enabled: true, className: nginx, host: banking.example.com }
autoscaling: { enabled: true, min: 2, max: 6, cpu: 70 }
