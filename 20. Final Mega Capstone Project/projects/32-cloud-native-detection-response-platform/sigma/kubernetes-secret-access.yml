title: Kubernetes Secret Read by Default Namespace Identity
id: 64dd349c-74db-4fc6-9da3-bde9a340fdaa
status: test
logsource: { product: kubernetes, service: audit }
detection:
  selection:
    verb: get
    objectRef.resource: secrets
    user.username|startswith: "system:serviceaccount:default:"
  condition: selection
level: high
falsepositives: [Approved secret synchronization controllers]
