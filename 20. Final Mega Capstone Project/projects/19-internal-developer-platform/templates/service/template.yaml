apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata: { name: production-service, title: Production Service Golden Path, description: Secure service repository with GitOps delivery }
spec:
  owner: platform-engineering
  type: service
  parameters:
    - title: Service identity
      required: [name, owner, system, repository]
      properties:
        name: { title: Service name, type: string, pattern: "^[a-z][a-z0-9-]{2,40}$" }
        owner: { title: Owner, type: string, ui:field: OwnerPicker, ui:options: { catalogFilter: { kind: [Group] } } }
        system: { title: System, type: string, ui:field: EntityPicker, ui:options: { catalogFilter: { kind: [System] } } }
        repository: { title: Repository, type: string, ui:field: RepoUrlPicker, ui:options: { allowedHosts: [github.com] } }
        tier: { title: Service tier, type: string, enum: [tier-1,tier-2,tier-3], default: tier-2 }
  steps:
    - id: fetch
      name: Render repository
      action: fetch:template
      input: { url: ./skeleton, values: { name: "${{ parameters.name }}", owner: "${{ parameters.owner }}", system: "${{ parameters.system }}", tier: "${{ parameters.tier }}" } }
    - id: publish
      name: Publish repository
      action: publish:github
      input: { repoUrl: "${{ parameters.repository }}", defaultBranch: main, protectDefaultBranch: true, requireCodeOwnerReviews: true, description: "${{ parameters.name }} generated by the production golden path" }
    - id: register
      name: Register component
      action: catalog:register
      input: { repoContentsUrl: "${{ steps.publish.output.repoContentsUrl }}", catalogInfoPath: /catalog-info.yaml }
  output:
    links:
      - { title: Repository, url: "${{ steps.publish.output.remoteUrl }}" }
      - { title: Catalog entity, icon: catalog, entityRef: "${{ steps.register.output.entityRef }}" }
