image:
  registry: ghcr.io
  owner: replace-me
  prefix: 12-typescript-nestjs-angular-saas
  tag: 0.1.0
  pullPolicy: IfNotPresent
existingSecret: ""
config: { APP_ENV: production, LOG_LEVEL: info }
