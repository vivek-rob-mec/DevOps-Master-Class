{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "standard-staging",
  "namePrefix": "node-",
  "resources": [
    "../../../base",
    "pdb.yaml"
  ],
  "labels": [
    {
      "pairs": {
        "app.kubernetes.io/instance": "node"
      },
      "includeSelectors": true,
      "includeTemplates": true
    }
  ],
  "configMapGenerator": [
    {
      "name": "deployment-config",
      "literals": [
        "APP_ENV=staging",
        "APP_VERSION=unreleased"
      ]
    }
  ],
  "images": [
    {
      "name": "deployment-demo",
      "newName": "ghcr.io/REPLACE_OWNER/standard-node",
      "newTag": "unreleased"
    }
  ],
  "replicas": [
    {
      "name": "deployment-demo",
      "count": 2
    }
  ]
}
