{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "deployment-demo",
    "labels": {
      "app.kubernetes.io/name": "deployment-demo"
    }
  },
  "spec": {
    "replicas": 1,
    "revisionHistoryLimit": 5,
    "progressDeadlineSeconds": 300,
    "minReadySeconds": 10,
    "strategy": {
      "type": "RollingUpdate",
      "rollingUpdate": {
        "maxSurge": 1,
        "maxUnavailable": 0
      }
    },
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "deployment-demo"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "deployment-demo"
        }
      },
      "spec": {
        "serviceAccountName": "deployment-demo",
        "automountServiceAccountToken": false,
        "terminationGracePeriodSeconds": 30,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "runAsGroup": 10001,
          "fsGroup": 10001,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "app",
            "image": "deployment-demo:unreleased",
            "ports": [
              {
                "name": "http",
                "containerPort": 8080
              }
            ],
            "envFrom": [
              {
                "configMapRef": {
                  "name": "deployment-config"
                }
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "512Mi"
              }
            },
            "startupProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": "http"
              },
              "periodSeconds": 5,
              "failureThreshold": 30
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/readyz",
                "port": "http"
              },
              "periodSeconds": 5,
              "timeoutSeconds": 2,
              "failureThreshold": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": "http"
              },
              "periodSeconds": 10,
              "timeoutSeconds": 2,
              "failureThreshold": 3
            },
            "lifecycle": {
              "preStop": {
                "sleep": {
                  "seconds": 5
                }
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {
              "medium": "Memory",
              "sizeLimit": "64Mi"
            }
          }
        ]
      }
    }
  }
}
