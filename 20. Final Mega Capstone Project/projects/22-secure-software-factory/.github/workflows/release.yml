name: trusted-release
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read, packages: write, id-token: write, attestations: write }
concurrency: { group: production-release, cancel-in-progress: false }
jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_action_pins.py .github/workflows
      - name: Build immutable image
        id: build
        env:
          IMAGE: "ghcr.io/${{ github.repository }}/secure-app"
          CR_PAT: "${{ github.token }}"
        run: |
          echo "$CR_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --build-arg REVISION="${{ github.sha }}" -t "$IMAGE:${{ github.sha }}" app
          docker push "$IMAGE:${{ github.sha }}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with: { image: "${{ steps.build.outputs.digest }}", format: spdx-json, output-file: artifacts/sbom.spdx.json, upload-artifact: false }
      - uses: sigstore/cosign-installer@351ea76151ae2dbbf52374c9dd639f4981de944f # v4.1.2
        with: { cosign-release: v3.0.6 }
      - run: cosign sign --yes "${{ steps.build.outputs.digest }}"
      - run: cosign attest --yes --type spdxjson --predicate artifacts/sbom.spdx.json "${{ steps.build.outputs.digest }}"
