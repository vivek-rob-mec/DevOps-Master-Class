apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: supplychain, namespace: supplychain-java }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: app, app.kubernetes.io/part-of: supplychain } }
  endpoints: [{ port: http, path: /metrics, interval: 30s, scrapeTimeout: 10s }]
