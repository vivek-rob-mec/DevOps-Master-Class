services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orders}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 20 }
  migrate:
    image: postgres:18.0-alpine
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: [./migrations:/migrations:ro]
    command: [sh, -ec, 'for file in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h postgres -U "$${POSTGRES_USER:-app}" -d "$${POSTGRES_DB:-orders}" -f "$$file"; done']
volumes: { postgres-data: {} }
