apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: supplychain, namespace: supplychain-java }
spec:
  groups:
    - name: supplychain.availability
      rules:
        - alert: PublicEndpointDown
          expr: up{namespace="supplychain-java",service="supplychain-app"} == 0
          for: 5m
          labels: { severity: critical }
          annotations: { summary: "supplychain entry workload is down", runbook_url: "docs/RUNBOOK.md" }
