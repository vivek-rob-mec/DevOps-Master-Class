apiVersion: v1
kind: Secret
metadata:
  name: helpdesk-runtime
  namespace: helpdesk-node
  annotations: { template.devops.example/local-placeholders-only: "true" }
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: local-development-only
  POSTGRES_DB: app
  DATABASE_URL: postgresql://app:local-development-only@postgres:5432/app
  JWT_SIGNING_KEY: replace-through-approved-secret-manager
