{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: {{ .Release.Name }}-saas }
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /health
            pathType: Exact
            backend: { service: { name: {{ .Release.Name }}-saas-api, port: { number: 80 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-saas-api, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-saas-frontend, port: { number: 80 } } }
{{- end }}
