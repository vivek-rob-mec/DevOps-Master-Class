apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: payment-risk, namespace: payment-risk-rust }
spec:
  groups:
    - name: payment-risk.availability
      rules:
        - alert: PublicEndpointDown
          expr: up{namespace="payment-risk-rust",service="payment-risk-app"} == 0
          for: 5m
          labels: { severity: critical }
          annotations: { summary: "payment-risk entry workload is down", runbook_url: "docs/RUNBOOK.md" }
