apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: claims, namespace: claims-dotnet }
spec:
  groups:
    - name: claims.availability
      rules:
        - alert: PublicEndpointDown
          expr: up{namespace="claims-dotnet",service="claims-app"} == 0
          for: 5m
          labels: { severity: critical }
          annotations: { summary: "claims entry workload is down", runbook_url: "docs/RUNBOOK.md" }
