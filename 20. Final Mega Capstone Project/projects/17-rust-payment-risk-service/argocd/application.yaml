apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: payment-risk, namespace: argocd, finalizers: [resources-finalizer.argocd.argoproj.io] }
spec:
  project: default
  source:
    repoURL: https://github.com/replace-me/devops-masterclass.git
    targetRevision: main
    path: "20. Final Mega Capstone Project/projects/17-rust-payment-risk-service/k8s/overlays/prod"
  destination: { server: https://kubernetes.default.svc, namespace: payment-risk-rust }
  syncPolicy:
    automated: { prune: true, selfHeal: true, allowEmpty: false }
    syncOptions: [CreateNamespace=true, PruneLast=true]
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
