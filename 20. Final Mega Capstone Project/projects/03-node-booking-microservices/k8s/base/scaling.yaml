---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: booking-gateway, namespace: booking-node }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: booking-gateway }
  minReplicas: 2
  maxReplicas: 6
  behavior: { scaleDown: { stabilizationWindowSeconds: 300 } }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: booking-gateway, namespace: booking-node }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: booking }
